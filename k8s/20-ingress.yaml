# Requires an ingress controller (e.g. ingress-nginx) installed on the cluster.
# Adjust `host` to your domain, or remove the `host` field to accept any host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-va-ingress
  namespace: ai-virtual-assistant
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: ai-virtual-assistant.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8501
