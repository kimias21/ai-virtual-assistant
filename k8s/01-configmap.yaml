apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-va-config
  namespace: ai-virtual-assistant
data:
  HF_MODEL_ID: "openai/gpt-oss-20b"
  SYSTEM_PROMPT: "You are a helpful, concise virtual assistant. Answer clearly and admit when you are not sure."
  MAX_NEW_TOKENS: "512"
  TEMPERATURE: "0.7"
  LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  BACKEND_URL: "http://backend:8000"
