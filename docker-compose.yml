services:
  backend:
    build:
      context: ./backend
    image: ai-virtual-assistant-backend:local
    container_name: ai-va-backend
    ports:
      - "8000:8000"
    environment:
      HF_MODEL_ID: ${HF_MODEL_ID:-HuggingFaceH4/zephyr-7b-beta}
      HF_API_TOKEN: ${HF_API_TOKEN}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-You are a helpful, concise virtual assistant.}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-512}
      TEMPERATURE: ${TEMPERATURE:-0.7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: ai-virtual-assistant-frontend:local
    container_name: ai-va-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      API_PREFIX: /api/v1
    depends_on:
      backend:
        condition: service_healthy
