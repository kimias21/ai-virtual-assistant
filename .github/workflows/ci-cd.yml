name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  lint-and-test:
    name: Lint & test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend/app

      - name: Run tests
        run: pytest tests -v
        env:
          HF_API_TOKEN: "dummy-token-for-ci"

  build-images:
    name: Build & push Docker images
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-hf-space:
    name: Sync Hugging Face Space (public demo link)
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Requires repo secrets: HF_TOKEN (write access token) and HF_SPACE_REPO
    # (e.g. "your-username/ai-virtual-assistant"). Skips gracefully if unset,
    # so this workflow still works before the Space is created.
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Space payload
        run: |
          mkdir -p /tmp/space_payload
          cp huggingface_space/Dockerfile /tmp/space_payload/Dockerfile
          cp huggingface_space/start.sh /tmp/space_payload/start.sh
          cp huggingface_space/README.md /tmp/space_payload/README.md
          cp -r backend /tmp/space_payload/backend
          cp -r frontend /tmp/space_payload/frontend

      - name: Push to Hugging Face Space
        if: ${{ env.HF_TOKEN != '' && env.HF_SPACE_REPO != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          pip install -q huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(
              folder_path='/tmp/space_payload',
              repo_id=os.environ['HF_SPACE_REPO'],
              repo_type='space',
              commit_message='Sync from GitHub Actions',
          )
          "

  deploy-notice:
    name: Deployment reminder
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Print next steps
        run: |
          echo "Images pushed to GHCR."
          echo "Update k8s/*.yaml image references and run:"
          echo "  kubectl apply -f k8s/"
          echo "Set HF_TOKEN + HF_SPACE_REPO secrets to auto-sync the public Hugging Face Space demo link."
